# BudgetBy Cloud Deployment Blueprint for Render.com (100% Free Tier, Zero Card)
services:
  - type: web
    name: budgetby-storefront
    runtime: python
    region: singapore # Closest free region to India for ultra-low latency
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn budgetby.dashboard.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_SECRET_KEY
        value: bb_sec_9e72f8a14b30c5e7d82f091a384b62d1
      - key: DASHBOARD_PORT
        value: 5000
